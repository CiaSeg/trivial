<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivial del Lore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f5f3fa; --surface: #ffffff; --surface-2: #ebe8f4; --fg: #1c1738; --muted: #5f5a7a; --line: #d9d4ea;
  --btn: #1c1738; --btn-fg: #ffffff; --ok: #17803f; --ok-on: #fff; --bad: #c0262d; --bad-on: #fff;
  --k0: #2f6fed; --k0-on: #fff; --k1: #c2358f; --k1-on: #fff; --k2: #178246; --k2-on: #fff;
  --k3: #f08a1c; --k3-on: #1c1738; --k4: #f2c500; --k4-on: #1c1738; --k5: #d7263d; --k5-on: #fff;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #13101f; --surface: #1d1930; --surface-2: #2a2544; --fg: #f2eefc; --muted: #a39dc2; --line: #3a345a;
    --btn: #f2eefc; --btn-fg: #13101f; --ok: #4cc27a; --ok-on: #0d2418; --bad: #ff6b73; --bad-on: #2a0a0d;
    --k0: #5b8cff; --k1: #e062b0; --k2: #3fbf75; --k2-on: #0d2418; --k5: #ff5468;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-body); padding: 18px 16px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; }
.k0 { --k: var(--k0); --k-on: var(--k0-on); } .k1 { --k: var(--k1); --k-on: var(--k1-on); }
.k2 { --k: var(--k2); --k-on: var(--k2-on); } .k3 { --k: var(--k3); --k-on: var(--k3-on); }
.k4 { --k: var(--k4); --k-on: var(--k4-on); } .k5 { --k: var(--k5); --k-on: var(--k5-on); }
button, input { font-family: var(--f-body); color: var(--fg); }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 54px; height: 54px; flex: none; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.8rem, 4.5vw, 2.7rem); line-height: 1; letter-spacing: -.02em; margin: 0; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }

.btn { border: 0; cursor: pointer; font-weight: 700; font-size: 1rem; padding: 12px 20px; border-radius: 12px; background: var(--btn); color: var(--btn-fg); }
.btn.big { font-size: 1.15rem; padding: 16px 30px; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.btn.ghost:hover { border-color: var(--fg); }
.btn.small { font-size: .85rem; padding: 8px 12px; border-radius: 10px; }
.btn.ok { background: var(--ok); color: var(--ok-on); }
.btn.ko { background: var(--bad); color: var(--bad-on); }
.btn:disabled { opacity: .5; cursor: default; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: clamp(18px, 3vw, 32px); }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; margin: 0 0 6px; }
.lead { margin: 0 0 18px; color: var(--muted); }
.note { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
.note.err { border-left: 5px solid var(--bad); }
.stat { color: var(--muted); font-size: .9rem; }

label.l { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
input[type="text"] { width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
.teams { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 12px; }
.teamrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); }
.teamrow input { background: var(--surface); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }

/* Partida */
.turnbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.turn { color: var(--muted); font-size: .9rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.turn strong { display: block; font-family: var(--f-display); font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -.01em; text-transform: none; color: var(--fg); line-height: 1.1; }
.members { color: var(--muted); font-size: .95rem; margin-top: 2px; text-transform: none; letter-spacing: 0; font-weight: 600; }
.teampills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: .9rem; }
.pill[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }

.mode { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 18px; max-width: 520px; }
.mode button { flex: 1; border: 0; background: transparent; font-weight: 700; padding: 12px 10px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
.mode button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }

.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.cat { display: flex; align-items: center; gap: 14px; min-height: 96px; border: 0; border-radius: 18px; background: var(--k); color: var(--k-on); padding: 16px 20px; cursor: pointer; text-align: left; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.2rem, 2.4vw, 1.55rem); line-height: 1.1; transition: transform .1s; }
.cat:hover { transform: translateY(-2px); }
.cat .wedge { width: 44px; height: 44px; flex: none; }
.cat small { display: block; font-family: var(--f-body); font-weight: 600; font-size: .8rem; opacity: .85; margin-top: 4px; }
.cat:disabled { opacity: .4; cursor: default; transform: none; }

.qcard { border: 3px solid var(--k); border-radius: 16px; overflow: hidden; background: var(--surface); }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--k); color: var(--k-on); padding: 12px 18px; }
.cname { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; }
.badge { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 2px solid currentColor; }
.qbody { padding: clamp(18px, 3vw, 34px); }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.45rem, 3.4vw, 2.5rem); line-height: 1.18; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.opts { list-style: none; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opts li { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; font-size: clamp(1.05rem, 2vw, 1.3rem); font-weight: 600; }
.opts li b { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--k); color: var(--k-on); flex: none; font-size: .85em; }
.opts li.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.answer { margin-top: 22px; padding: 16px 18px; background: var(--surface-2); border-radius: 12px; }
.answer small { display: block; font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.answer p { margin: 0; font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.actions.two .btn { flex: 1 1 200px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 22px; }
details summary { cursor: pointer; font-weight: 700; }

@media (max-width: 640px) { .teamrow { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<input type="file" id="filepick" accept=".xlsx,.xls,.csv" hidden>

<script>
(function () {
  'use strict';
  var EXCEL = 'preguntas.xlsx';
  var KEY = 'trivial-lore-v2';
  var app = document.getElementById('app');

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  function splitList(s, re) { return String(s || '').split(re).map(function (x) { return x.trim(); }).filter(Boolean); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ teams: S.teams, turn: S.turn, used: S.used, playing: S.playing })); } catch (e) {} }

  /* ---------- estado ---------- */
  var saved = load();
  var S = {
    qs: [], cats: [], source: '', error: '', loading: true,
    teams: saved.teams || [{ name: 'Equipo 1', members: '' }, { name: 'Equipo 2', members: '' }],
    turn: saved.turn || 0, used: saved.used || {}, playing: !!saved.playing,
    hard: false, cur: null, shown: false, msg: ''
  };
  if (S.turn >= S.teams.length) S.turn = 0;

  /* ---------- lectura del Excel ---------- */
  function pickCol(headers, keys) {
    for (var i = 0; i < headers.length; i++) {
      var h = norm(headers[i]);
      for (var k = 0; k < keys.length; k++) if (h.indexOf(keys[k]) === 0 || h.indexOf(keys[k]) > -1) return i;
    }
    return -1;
  }
  function parseWorkbook(wb, source) {
    var sheetName = wb.SheetNames.find(function (n) { return norm(n).indexOf('pregunta') > -1; }) || wb.SheetNames[0];
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: false });
    var hi = rows.findIndex(function (r) { return r.some(function (c) { return norm(c).indexOf('pregunta') > -1; }); });
    if (hi < 0) throw new Error('No encuentro la fila de cabeceras (debe tener una columna «Pregunta»).');
    var H = rows[hi];
    var col = {
      cat: pickCol(H, ['categ']), dif: pickCol(H, ['dific']), per: pickCol(H, ['persona']),
      q: H.findIndex(function (h) { return norm(h).indexOf('pregunta') === 0; }),
      opt: pickCol(H, ['opcion']), a: pickCol(H, ['respuesta'])
    };
    if (col.cat < 0 || col.q < 0) throw new Error('Faltan las columnas «Categoría» o «Pregunta».');
    var qs = [], cats = [];
    rows.slice(hi + 1).forEach(function (r, n) {
      var q = String(r[col.q] || '').trim(), c = String(r[col.cat] || '').trim();
      if (!q || !c) return;
      var d = col.dif > -1 ? norm(r[col.dif]) : '';
      var hard = /dific|quesito|alta|hard|dura/.test(d);
      if (cats.findIndex(function (x) { return norm(x) === norm(c); }) < 0) cats.push(c);
      qs.push({
        id: norm(c) + '|' + norm(q),
        cat: cats.findIndex(function (x) { return norm(x) === norm(c); }),
        hard: hard,
        people: col.per > -1 ? splitList(r[col.per], /[,;\/]| y /).map(norm) : [],
        q: q,
        opts: col.opt > -1 ? splitList(r[col.opt], /;|\n|\|/) : [],
        a: col.a > -1 ? String(r[col.a] || '').trim() : ''
      });
    });
    if (!qs.length) throw new Error('El Excel no tiene ninguna pregunta rellena.');
    S.qs = qs; S.cats = cats; S.source = source; S.error = ''; S.loading = false;
  }
  function loadExcel() {
    S.loading = true; S.error = ''; render();
    if (typeof XLSX === 'undefined') { S.loading = false; S.error = 'No se pudo cargar el lector de Excel (¿sin internet?).'; render(); return; }
    fetch(EXCEL + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('No encuentro ' + EXCEL + ' junto a la página.'); return r.arrayBuffer(); })
      .then(function (buf) { parseWorkbook(XLSX.read(buf, { type: 'array' }), EXCEL); render(); })
      .catch(function (e) {
        S.loading = false;
        S.error = (location.protocol === 'file:')
          ? 'Has abierto la página como archivo y el navegador no deja leer el Excel así. Ábrela desde IntelliJ (botón del navegador arriba a la derecha) o desde GitHub Pages, o elige el Excel a mano.'
          : (e.message || 'No se pudo leer el Excel.');
        render();
      });
  }
  document.getElementById('filepick').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    f.arrayBuffer().then(function (buf) {
      try { parseWorkbook(XLSX.read(buf, { type: 'array' }), f.name); } catch (err) { S.error = err.message; S.loading = false; }
      render();
    });
    e.target.value = '';
  });

  /* ---------- lógica ---------- */
  function teamPeople(t) { return splitList(t.members, /[,;]| y /).map(norm); }
  function allowed(q, team) {
    var ppl = teamPeople(team);
    return !q.people.some(function (p) { return ppl.indexOf(p) > -1; });
  }
  function pool(cat, hard, team) {
    return S.qs.filter(function (q) { return q.cat === cat && q.hard === hard && allowed(q, team); });
  }
  function countFor(cat) {
    var t = S.teams[S.turn];
    var all = pool(cat, S.hard, t);
    var left = all.filter(function (q) { return !S.used[q.id]; }).length;
    return { all: all.length, left: left };
  }
  function draw(cat, avoidId) {
    var team = S.teams[S.turn], hard = S.hard, note = '';
    var p = pool(cat, hard, team);
    if (!p.length && hard) { p = pool(cat, false, team); note = 'No quedan preguntas difíciles en esta categoría para este equipo; sale una normal.'; hard = false; }
    if (!p.length) { S.msg = 'No hay preguntas en «' + S.cats[cat] + '» que pueda contestar ' + team.name + '.'; return null; }
    var fresh = p.filter(function (q) { return !S.used[q.id] && q.id !== avoidId; });
    if (!fresh.length) {
      p.forEach(function (q) { delete S.used[q.id]; });
      fresh = p.filter(function (q) { return q.id !== avoidId; });
      if (!fresh.length) fresh = p;
      note = (note ? note + ' ' : '') + 'Se habían gastado todas: vuelven a salir desde el principio.';
    }
    var q = fresh[Math.floor(Math.random() * fresh.length)];
    S.used[q.id] = 1; save();
    S.msg = note;
    return q;
  }

  /* ---------- dibujo ---------- */
  function slice(i, r) {
    var a0 = (i * 60 - 30) * Math.PI / 180, a1 = (i * 60 + 30) * Math.PI / 180;
    function p(a) { return (100 + r * Math.sin(a)).toFixed(2) + ' ' + (100 - r * Math.cos(a)).toFixed(2); }
    return 'M100 100L' + p(a0) + 'A' + r + ' ' + r + ' 0 0 1 ' + p(a1) + 'Z';
  }
  function logo() {
    var s = '<svg class="logo" viewBox="0 0 200 200" aria-hidden="true">';
    for (var i = 0; i < 6; i++) s += '<path class="k' + i + '" d="' + slice(i, 96) + '" fill="var(--k)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round"/>';
    return s + '</svg>';
  }
  function wedge(i) {
    var s = '<svg class="wedge" viewBox="0 0 200 200" aria-hidden="true">';
    for (var j = 0; j < 6; j++) s += '<path d="' + slice(j, 92) + '" fill="currentColor" opacity="' + (j === i % 6 ? 1 : .22) + '"/>';
    return s + '</svg>';
  }
  function header() {
    return '<header class="top"><div class="brand">' + logo() +
      '<div><h1>Trivial del Lore</h1><p class="sub">Preguntas para el tablero</p></div></div>' +
      (S.playing ? '<button class="btn ghost small" data-a="setup">Equipos</button>' : '') + '</header>';
  }
  function sourceLine() {
    if (S.loading) return '<p class="stat">Cargando preguntas…</p>';
    var s = '';
    if (S.error) s += '<p class="note err">' + esc(S.error) + '</p>';
    if (S.qs.length) {
      var hard = S.qs.filter(function (q) { return q.hard; }).length;
      s += '<p class="stat">' + S.qs.length + ' preguntas (' + hard + ' difíciles) en ' + S.cats.length + ' categorías · desde ' + esc(S.source) + '</p>';
    }
    return s;
  }

  function setupView() {
    var rows = S.teams.map(function (t, i) {
      return '<li class="teamrow"><div><label class="l" for="tn' + i + '">Equipo ' + (i + 1) + '</label>' +
        '<input type="text" id="tn' + i + '" data-team="' + i + '" data-f="name" value="' + esc(t.name) + '" maxlength="30"></div>' +
        '<div><label class="l" for="tm' + i + '">Quién juega (separado por comas)</label>' +
        '<input type="text" id="tm' + i + '" data-team="' + i + '" data-f="members" value="' + esc(t.members) + '" placeholder="Lucía, Marta" maxlength="200"></div></li>';
    }).join('');
    return '<section class="card"><h2>¿Quién juega?</h2>' +
      '<p class="lead">Pon los nombres tal como aparecen en la columna «Persona» del Excel. Así a nadie le sale una pregunta sobre sí misma.</p>' +
      '<ul class="teams">' + rows + '</ul>' +
      '<div class="row"><button class="btn ghost small" data-a="addteam"' + (S.teams.length >= 6 ? ' disabled' : '') + '>+ Añadir equipo</button>' +
      '<button class="btn ghost small" data-a="delteam"' + (S.teams.length <= 2 ? ' disabled' : '') + '>− Quitar equipo</button></div>' +
      '<button class="btn big" data-a="start"' + (S.qs.length ? '' : ' disabled') + '>' + (S.playing ? 'Volver a la partida' : 'Empezar') + '</button>' +
      '<div class="foot">' + sourceLine() + '</div>' +
      '<div class="foot"><button class="btn ghost small" data-a="reload">Recargar Excel</button>' +
      '<button class="btn ghost small" data-a="pick">Elegir otro Excel…</button>' +
      '<button class="btn ghost small" data-a="resetused">Olvidar preguntas ya usadas</button></div></section>';
  }

  function playView() {
    var t = S.teams[S.turn];
    var pills = S.teams.map(function (x, i) { return '<button class="pill" data-a="turn" data-i="' + i + '" aria-pressed="' + (i === S.turn) + '">' + esc(x.name) + '</button>'; }).join('');
    var top = '<div class="turnbar"><div class="turn">Turno de<strong>' + esc(t.name) + '</strong>' +
      (t.members.trim() ? '<div class="members">' + esc(t.members) + '</div>' : '') + '</div>' +
      '<div class="teampills" aria-label="Cambiar turno">' + pills + '</div></div>';
    var msg = S.msg ? '<p class="note" role="status">' + esc(S.msg) + '</p>' : '';

    if (!S.cur) {
      var cats = S.cats.map(function (c, i) {
        var n = countFor(i);
        return '<button class="cat k' + (i % 6) + '" data-a="cat" data-i="' + i + '">' + wedge(i) +
          '<span>' + esc(c) + '<small>' + (n.all ? n.left + ' de ' + n.all + ' sin salir' : (S.hard ? 'Sin difíciles · saldrá normal' : 'Sin preguntas para este equipo')) + '</small></span></button>';
      }).join('');
      return top + msg +
        '<div class="mode" role="group" aria-label="Tipo de pregunta"><button data-a="hard" data-v="0" aria-pressed="' + !S.hard + '">Pregunta normal</button>' +
        '<button data-a="hard" data-v="1" aria-pressed="' + S.hard + '">Pregunta de quesito</button></div>' +
        '<p class="lead">¿En qué color ha caído la ficha?</p>' +
        '<div class="cats">' + cats + '</div>' +
        '<div class="foot">' + sourceLine() + '<button class="btn ghost small" data-a="reload">Recargar Excel</button></div>';
    }

    var q = S.cur;
    var right = function (o) { return norm(o) === norm(q.a); };
    var h = top + msg + '<article class="qcard k' + (q.cat % 6) + '"><div class="qhead"><span class="cname">' + esc(S.cats[q.cat]) + '</span>' +
      (q.hard ? '<span class="badge">Quesito · difícil</span>' : '') + '</div><div class="qbody"><p class="qtext">' + esc(q.q) + '</p>';
    if (q.opts.length) {
      h += '<ol class="opts">' + q.opts.map(function (o, i) {
        return '<li class="' + (S.shown && right(o) ? 'right' : '') + '"><b>' + String.fromCharCode(65 + i) + '</b>' + esc(o) + '</li>';
      }).join('') + '</ol>';
    }
    if (S.shown) h += '<div class="answer"><small>Respuesta</small><p>' + esc(q.a || '(sin respuesta en el Excel)') + '</p></div>';
    if (!S.shown) {
      h += '<div class="actions"><button class="btn big" data-a="show">Ver respuesta</button>' +
        '<button class="btn ghost" data-a="swap">Cambiar pregunta</button><button class="btn ghost" data-a="back">Volver</button></div>';
    } else {
      h += '<div class="actions two"><button class="btn big ok" data-a="ok">Acierto · sigue</button><button class="btn big ko" data-a="ko">Fallo · pasa turno</button></div>';
    }
    return h + '</div></article>';
  }

  function render() {
    app.innerHTML = header() + (S.playing && S.qs.length ? '<section class="card">' + playView() + '</section>' : setupView());
  }

  /* ---------- eventos ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, i = +b.dataset.i;
    if (a === 'addteam') S.teams.push({ name: 'Equipo ' + (S.teams.length + 1), members: '' });
    else if (a === 'delteam') { S.teams.pop(); if (S.turn >= S.teams.length) S.turn = 0; }
    else if (a === 'start') { S.teams.forEach(function (t, k) { t.name = t.name.trim() || ('Equipo ' + (k + 1)); }); S.playing = true; S.msg = ''; }
    else if (a === 'setup') { S.playing = false; S.cur = null; S.shown = false; }
    else if (a === 'reload') { loadExcel(); return; }
    else if (a === 'pick') { document.getElementById('filepick').click(); return; }
    else if (a === 'resetused') { S.used = {}; S.msg = ''; }
    else if (a === 'turn') { S.turn = i; S.msg = ''; }
    else if (a === 'hard') { S.hard = b.dataset.v === '1'; S.msg = ''; }
    else if (a === 'cat') { S.cur = draw(i); S.shown = false; }
    else if (a === 'swap') { var nq = draw(S.cur.cat, S.cur.id); if (nq) S.cur = nq; }
    else if (a === 'show') S.shown = true;
    else if (a === 'back') { S.cur = null; S.msg = ''; }
    else if (a === 'ok') { S.msg = 'Acierto de ' + S.teams[S.turn].name + '. Tira otra vez.'; S.cur = null; S.hard = false; }
    else if (a === 'ko') { S.msg = 'Fallo de ' + S.teams[S.turn].name + '. Pasa el turno.'; S.turn = (S.turn + 1) % S.teams.length; S.cur = null; S.hard = false; }
    save(); render(); window.scrollTo(0, 0);
  });
  app.addEventListener('input', function (e) {
    var el = e.target; if (el.dataset.team === undefined) return;
    S.teams[+el.dataset.team][el.dataset.f] = el.value; save();
  });

  render();
  loadExcel();
})();
</script>
</body>
</html>
