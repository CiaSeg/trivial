<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trivial del Lore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Marcador de equipos a la izquierda, escenario grande a la derecha (pensado para una tele). Seis colores de quesito mandan; el resto es tinta sobre papel violeta. */
:root {
  --bg: #f5f3fa; --surface: #ffffff; --surface-2: #ebe8f4; --fg: #1c1738; --muted: #5f5a7a; --line: #d9d4ea;
  --btn: #1c1738; --btn-fg: #ffffff; --ok: #17803f; --ok-on: #ffffff; --bad: #c0262d; --bad-on: #ffffff;
  --k0: #2f6fed; --k0-on: #ffffff; --k1: #c2358f; --k1-on: #ffffff; --k2: #178246; --k2-on: #ffffff;
  --k3: #f08a1c; --k3-on: #1c1738; --k4: #f2c500; --k4-on: #1c1738; --k5: #d7263d; --k5-on: #ffffff;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13101f; --surface: #1d1930; --surface-2: #2a2544; --fg: #f2eefc; --muted: #a39dc2; --line: #3a345a;
    --btn: #f2eefc; --btn-fg: #13101f; --ok: #4cc27a; --ok-on: #0d2418; --bad: #ff6b73; --bad-on: #2a0a0d;
    --k0: #5b8cff; --k1: #e062b0; --k2: #3fbf75; --k5: #ff5468; --k2-on: #0d2418;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg); color: var(--fg);
  background-image:
    radial-gradient(60rem 26rem at 6% -8%, color-mix(in srgb, var(--k0) 17%, transparent), transparent 70%),
    radial-gradient(48rem 24rem at 98% -4%, color-mix(in srgb, var(--k1) 15%, transparent), transparent 70%),
    radial-gradient(color-mix(in srgb, var(--fg) 8%, transparent) 1px, transparent 1.5px);
  background-size: auto, auto, 22px 22px;
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; }
.k0 { --k: var(--k0); --k-on: var(--k0-on); }
.k1 { --k: var(--k1); --k-on: var(--k1-on); }
.k2 { --k: var(--k2); --k-on: var(--k2-on); }
.k3 { --k: var(--k3); --k-on: var(--k3-on); }
.k4 { --k: var(--k4); --k-on: var(--k4-on); }
.k5 { --k: var(--k5); --k-on: var(--k5-on); }

button, input { font-family: var(--f-body); color: var(--fg); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

/* Cabecera */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 54px; height: 54px; flex: none; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.8rem, 4.5vw, 2.7rem); line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tab { border: 0; background: transparent; font-weight: 600; font-size: .95rem; padding: 9px 16px; border-radius: 9px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }

/* Botones */
.btn { border: 0; cursor: pointer; font-weight: 700; font-size: 1rem; padding: 12px 20px; border-radius: 12px; background: var(--btn); color: var(--btn-fg); }
.btn.big { font-size: 1.15rem; padding: 16px 30px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--fg); }
.btn.small { font-size: .85rem; padding: 8px 12px; border-radius: 10px; }
.btn.ok { background: var(--ok); color: var(--ok-on); }
.btn.ko { background: var(--bad); color: var(--bad-on); }

/* Juego */
.game { display: grid; gap: 20px; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); align-items: start; }
.board { display: grid; gap: 14px; }
.team { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; position: relative; min-width: 0; box-shadow: 0 4px 0 var(--line); transition: transform .15s, box-shadow .15s; }
.team[data-action] { cursor: pointer; }
.team[data-action]:hover { transform: translateY(-2px); }
.team.on { border-color: var(--fg); box-shadow: 0 6px 0 var(--fg); transform: translateY(-3px); }
.team .tinfo { min-width: 0; }
.tname { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; line-height: 1.15; overflow-wrap: anywhere; }
.tmem { color: var(--muted); font-size: .85rem; font-weight: 600; overflow-wrap: anywhere; }
.tcount { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.flag { position: absolute; top: -11px; right: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 700; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; }
.token { width: 76px; height: 76px; flex: none; display: block; }
.token path { stroke: var(--surface); stroke-width: 4; stroke-linejoin: round; }
.token .w { fill: var(--k); }
.token .nw { fill: var(--surface-2); }
.token path[data-action] { cursor: pointer; }
.hint { margin: 0; font-size: .8rem; color: var(--muted); }

.stage { position: relative; overflow: hidden; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: calc(clamp(16px, 3vw, 32px) + 8px) clamp(16px, 3vw, 32px) clamp(16px, 3vw, 32px); min-height: 440px; min-width: 0; box-shadow: 0 10px 0 color-mix(in srgb, var(--fg) 7%, transparent); }
.note { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
.note.err { border-left: 5px solid var(--bad); }
.turnline { margin: 0 0 6px; text-align: center; font-size: 1.1rem; color: var(--muted); }
.turnline strong { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--fg); display: block; line-height: 1.1; overflow-wrap: anywhere; }
.centered { display: flex; flex-direction: column; align-items: center; }

.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px 14px; width: 100%; margin-top: 20px; padding-bottom: 6px; }
.pick { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; cursor: pointer; background: var(--k); color: var(--k-on); padding: 16px 18px; border-radius: 16px; box-shadow: 0 6px 0 color-mix(in srgb, var(--k) 60%, #000); transition: transform .12s, box-shadow .12s; min-width: 0; }
.pick:hover { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, var(--k) 60%, #000); }
.pick:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--k) 60%, #000); }
.pick:disabled { opacity: .45; cursor: default; transform: none; }
.pk-ico { width: 58px; height: 58px; flex: none; }
.pk-txt { min-width: 0; }
.pk-name { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.1rem, 2.4vw, 1.5rem); line-height: 1.1; overflow-wrap: anywhere; }
.pk-sub { display: block; margin-top: 3px; font-size: .8rem; font-weight: 600; opacity: .88; }
.turnhint { margin: 8px 0 0; color: var(--muted); text-align: center; }
.wedgechk { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 16px; border: 2px solid var(--line); border-radius: 12px; font-weight: 700; cursor: pointer; }
.wedgechk input { width: 22px; height: 22px; accent-color: var(--fg); cursor: pointer; }
.wedgechk:has(input:checked) { border-color: var(--fg); background: var(--surface-2); }
.wedgechk small { font-weight: 600; color: var(--muted); }

.qcard { position: relative; overflow: hidden; border-radius: 20px; background: var(--k); color: var(--k-on); animation: pop .35s ease-out; box-shadow: 0 8px 0 color-mix(in srgb, var(--k) 62%, #000); }
.qcard::before { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: var(--k-on); opacity: .1; }
.qcard::after { content: ""; position: absolute; left: -60px; bottom: -100px; width: 220px; height: 220px; border-radius: 50%; background: var(--k-on); opacity: .08; }
.qcard .btn.ghost { color: inherit; border-color: color-mix(in srgb, currentColor 55%, transparent); }
.qcard .btn.ghost:hover:not(:disabled) { border-color: currentColor; }
.qcard .hint { color: inherit; opacity: .85; }
.qcard .btn.ok, .qcard .btn.ko { box-shadow: 0 0 0 3px var(--surface); }
.qhead { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 16px 22px 0; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .qcard { animation: none; } }
.cname { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; }
.badge { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 2px solid currentColor; }
.badge.solid { background: var(--k-on); color: var(--k); border-color: var(--k-on); }
.qbody { position: relative; z-index: 1; padding: clamp(14px, 2.4vw, 26px) clamp(18px, 3vw, 34px) clamp(20px, 3vw, 34px); }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.45rem, 3.4vw, 2.5rem); line-height: 1.18; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.opts { list-style: none; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opts li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--k-on) 14%, transparent); border: 2px solid color-mix(in srgb, var(--k-on) 30%, transparent); font-size: clamp(1.05rem, 2vw, 1.3rem); font-weight: 600; overflow-wrap: anywhere; }
.opts li b { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--k-on); color: var(--k); flex: none; font-size: .85em; }
.opts.done li:not(.right) { opacity: .55; }
.opts li.right { background: var(--surface); color: var(--fg); border-color: var(--surface); opacity: 1; }
.opts li.right b { background: var(--ok); color: var(--ok-on); }
.answer { margin-top: 22px; padding: 16px 18px; background: var(--surface); color: var(--fg); border-radius: 14px; }
.answer small { display: block; font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.answer p { margin: 0; font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-weight: 600; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.actions.two .btn { flex: 1 1 200px; }

.win { text-align: center; padding: 10px 0; }
.win .token { width: min(70vw, 220px); height: min(70vw, 220px); margin: 0 auto 10px; }
.win h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
.win p { color: var(--muted); margin: 0 0 22px; }

/* Preparar partida */
.setup { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); align-items: center; }
.card { position: relative; overflow: hidden; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: calc(clamp(18px, 3vw, 32px) + 8px) clamp(18px, 3vw, 32px) clamp(18px, 3vw, 32px); min-width: 0; box-shadow: 0 10px 0 color-mix(in srgb, var(--fg) 7%, transparent); }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; margin: 0 0 6px; letter-spacing: -.01em; }
.lead { margin: 0 0 18px; color: var(--muted); }
.teamlist { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; }
.teamrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); }
.teamrow input { background: var(--surface); }
.teamlist label, .field label { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
input[type="text"] { width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.setup-art { width: 100%; max-width: 340px; justify-self: center; }
.setup-art svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 0 color-mix(in srgb, var(--fg) 14%, transparent)); }
.setup-art path { stroke: var(--bg); stroke-width: 4; stroke-linejoin: round; }
.banner { margin: 18px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; }
.rules { margin-top: 18px; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); display: grid; gap: 6px; }
.stat { color: var(--muted); font-size: .9rem; }

/* Pestaña Preguntas */
.qtable { width: 100%; border-collapse: collapse; margin: 6px 0 20px; font-variant-numeric: tabular-nums; }
.qtable th, .qtable td { text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--line); }
.qtable th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.qtable td.n { text-align: right; width: 90px; }
.qtable th.n { text-align: right; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--k); margin-right: 8px; vertical-align: -2px; }
.steps { margin: 0 0 18px; padding-left: 20px; color: var(--muted); display: grid; gap: 6px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

/* Identidad: tira de seis colores, luces y marcadores */
.stage::before, .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(90deg, var(--k0) 0 16.66%, var(--k1) 16.66% 33.33%, var(--k2) 33.33% 50%, var(--k3) 50% 66.66%, var(--k4) 66.66% 83.33%, var(--k5) 83.33% 100%); }
.lights { position: relative; display: flex; justify-content: space-between; list-style: none; margin: 0 0 12px; padding: 0 2px; height: 38px; overflow: hidden; }
.lights::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 3px; border-radius: 2px; background: var(--line); }
.lights li { position: relative; width: 12px; height: 18px; margin-top: 8px; border-radius: 50% 50% 55% 55%; background: var(--k); box-shadow: 0 0 12px color-mix(in srgb, var(--k) 70%, transparent); animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d); }
.lights li:nth-child(odd) { margin-top: 12px; }
.lights li::before { content: ""; position: absolute; left: 3px; top: -7px; width: 6px; height: 7px; background: var(--line); border-radius: 1px; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .lights li { animation: none; } }
.hl { background: linear-gradient(transparent 80%, var(--k4) 80% 95%, transparent 95%); padding: 0 .06em; }
.eyebrow { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pn { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.turns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
.turnbtn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 7px; font-weight: 700; cursor: pointer; }
.turnbtn:hover { border-color: var(--fg); }
.turnbtn[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.turnbtn[aria-pressed="true"] .pn { background: var(--btn-fg); color: var(--btn); }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear infinite; }
@keyframes fall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(640px) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.win, .win > * { position: relative; }

@media (max-width: 800px) {
  .game { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); order: 2; }
  .setup { grid-template-columns: minmax(0, 1fr); }
  .setup-art { max-width: 220px; order: -1; }
}
@media (max-width: 560px) { .teamrow { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) {
  .token { width: 64px; height: 64px; }
  .tab { padding: 8px 12px; }
}

/* Creador de preguntas */
.qimg { display: block; max-width: 100%; max-height: min(46vh, 440px); object-fit: contain; border-radius: 14px; margin-top: 18px; background: color-mix(in srgb, var(--k-on) 12%, transparent); }
.answer .qimg { background: var(--surface-2); margin-top: 12px; }
.creator { display: grid; gap: 20px; }
.hello { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.hello h2 { margin: 0; }
.big-add { width: 100%; font-size: 1.2rem; padding: 20px; border-radius: 16px; }
.form { display: grid; gap: 22px; }
.form .step { display: grid; gap: 10px; }
.form .step > .lbl { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; line-height: 1.2; }
.form .step > .lbl small { display: block; font-family: var(--f-body); font-weight: 600; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ccat { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--k); background: transparent; border-radius: 999px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
.ccat[aria-pressed="true"] { background: var(--k); color: var(--k-on); }
.ccat .dot { margin: 0; background: var(--k); }
.ccat[aria-pressed="true"] .dot { background: var(--k-on); }
.seg { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; max-width: 520px; }
.seg button { flex: 1; border: 0; background: transparent; font-weight: 700; padding: 12px 10px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }
.form textarea, .form input[type="text"] { width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 1.05rem; font-family: var(--f-body); color: var(--fg); }
.form textarea { min-height: 96px; resize: vertical; line-height: 1.35; }
.optrow { display: flex; gap: 8px; align-items: center; }
.optrow .ok-pick { flex: none; min-width: 118px; justify-content: center; display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; font-weight: 700; cursor: pointer; background: transparent; font-size: .9rem; white-space: nowrap; }
.optrow .ok-pick[aria-pressed="true"] { background: var(--ok); color: var(--ok-on); border-color: var(--ok); }
.optrow .x { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-size: 1.2rem; font-weight: 700; }
.pchip { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: .95rem; }
.pchip[aria-pressed="true"] { background: var(--bad); color: var(--bad-on); border-color: var(--bad); }
.addp { display: flex; gap: 8px; max-width: 420px; }
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.slot { border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; justify-items: start; }
.slot .slotl { font-weight: 700; }
.slot img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
label.btn { display: inline-block; cursor: pointer; }

.org .inner { display: grid; gap: 18px; margin-top: 16px; }

.kd { --k: #8a1538; --k-on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kx { --k: #b9a8ff; --k-on: #13101f; } :root:not([data-theme="light"]) .kd { --k: #ff7a9c; --k-on: #2a0a14; } }
.specials { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; width: 100%; margin-top: 16px; }
.pick .emo { width: 58px; height: 58px; flex: none; display: grid; place-items: center; font-size: 2.1rem; border-radius: 50%; background: color-mix(in srgb, var(--k-on) 18%, transparent); }

.vteam .token { width: 58px; height: 58px; }
.wpick { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.wbtn { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 14px; padding: 12px 18px; background: var(--k); color: var(--k-on); font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 5px 0 color-mix(in srgb, var(--k) 60%, #000); font-family: var(--f-display); }
.wbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--k) 60%, #000); }
.wbtn .pk-ico { width: 34px; height: 34px; }

.spchip { display: inline-flex; align-items: center; gap: 8px; border: 2px dashed var(--k); background: transparent; border-radius: 999px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 1rem; }
.spchip[aria-pressed="true"] { background: var(--k); color: var(--k-on); border-style: solid; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--btn); color: var(--btn-fg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
@media (max-width: 560px) { .myq { flex-wrap: wrap; } .myq .acts { width: 100%; } }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
(function () {
  'use strict';

  /* Las preguntas publicadas viven en preguntas.xlsx y sus fotos en la carpeta imagenes/ del repo.
     Lo que cada persona crea en la web se guarda en su navegador hasta que lo envía a la organizadora. */
  var EXCEL = 'preguntas.xlsx', IMGDIR = 'imagenes/';
  var GKEY = 'tl-excel-partida', NKEY = 'tl-excel-equipos', LKEY = 'tl-mis-preguntas';
  var HEAD = ['Categoría', 'Dificultad', 'Persona (no le puede tocar)', 'Pregunta', 'Opciones (separadas por ;)', 'Respuesta', 'Imagen pregunta', 'Imagen respuesta', 'Autora', 'ID'];
  var app = document.getElementById('app');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function splitList(s, re) { return String(s || '').split(re).map(function (x) { return x.trim(); }).filter(Boolean); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function people(s) { return splitList(s, /,|;|\/|\by\b/).map(norm); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function safeImg(n) { n = String(n || '').trim(); return n && !/[\\\/]/.test(n) && n.charAt(0) !== '.' ? n : ''; }

  /* ---------- Fotos guardadas en el navegador (IndexedDB) ---------- */
  var IMG = {}, dbp = null;
  function idb() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('trivial-lore', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('imgs'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function tx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('imgs', mode), st = t.objectStore('imgs'), out = fn(st);
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function putImg(name, blob) {
    return tx('readwrite', function (st) { st.put(blob, name); }).then(function () {
      if (IMG[name]) URL.revokeObjectURL(IMG[name]);
      IMG[name] = URL.createObjectURL(blob);
    });
  }
  function delImg(name) {
    if (!IMG[name]) return;
    URL.revokeObjectURL(IMG[name]); delete IMG[name];
    tx('readwrite', function (st) { st.delete(name); }).catch(function () {});
  }
  function getImgBlob(name) { return tx('readonly', function (st) { return st.get(name); }); }
  function loadImgs() {
    return idb().then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('imgs', 'readonly'), st = t.objectStore('imgs'), cur = st.openCursor();
        cur.onsuccess = function () {
          var c = cur.result;
          if (c) { IMG[c.key] = URL.createObjectURL(c.value); c.continue(); } else res();
        };
        cur.onerror = function () { res(); };
      });
    }).catch(function () {});
  }
  function imgURL(name) { name = safeImg(name); return !name ? '' : (IMG[name] || IMGDIR + encodeURIComponent(name)); }
  function imgTag(name) { var u = imgURL(name); return u ? '<img class="qimg" src="' + esc(u) + '" alt="">' : ''; }
  function shrink(file) {
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
      var sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(bmp.width * sc)); cv.height = Math.max(1, Math.round(bmp.height * sc));
      var cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(bmp, 0, 0, cv.width, cv.height);
      return new Promise(function (r) { cv.toBlob(r, 'image/jpeg', 0.82); });
    }).then(function (b) { if (!b) throw new Error('blob'); return b; });
  }

  /* ---------- Estado ---------- */
  var S = {
    view: 'play', repo: [], source: '', loading: true, error: '',
    teams: [{ name: 'Equipo 1', members: '' }, { name: 'Equipo 2', members: '' }],
    game: null, confirm: false, msg: '',
    local: { author: '', added: [], edits: {}, deleted: {}, sent: {}, sentAt: {} },
    form: null, formErr: '', newPerson: '', newCat: '', pack: null, showAll: false, filt: -1, toast: ''
  };
  var confirmTimer = null, toastTimer = null;

  function saveLocal() {
    if (!lsSet(LKEY, JSON.stringify(S.local))) toast('No se ha podido guardar en este navegador.');
  }
  function toast(t) {
    S.toast = t; renderToast();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = ''; renderToast(); }, 3200);
  }
  function renderToast() {
    var el = document.getElementById('toast');
    if (!S.toast) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = S.toast;
  }

  /* Lista efectiva = publicadas (menos borradas, con ediciones) + creadas aquí */
  function all() {
    var out = [], seen = {};
    S.repo.forEach(function (q) {
      if (S.local.deleted[q.id]) return;
      var e = S.local.edits[q.id] || q;
      seen[q.id] = out.length; out.push(e);
    });
    S.local.added.forEach(function (q) {
      if (S.local.deleted[q.id]) return;
      if (seen[q.id] !== undefined) out[seen[q.id]] = q; else out.push(q);
    });
    return out;
  }
  /* Duelos y retos van en la columna Categoría como «Duelo» y «Reto»; no son colores del tablero */
  function special(c) { c = norm(c); return /^(⚔️ ?)?duelo/.test(c) ? 'duelo' : (/^(🎯 ?)?reto/.test(c) ? 'reto' : ''); }
  var SPNAME = { duelo: 'Duelo', reto: 'Reto' };
  function catList() {
    var cats = [];
    all().forEach(function (q) { if (q.cat && !special(q.cat) && !cats.some(function (c) { return norm(c) === norm(q.cat); })) cats.push(q.cat); });
    return cats;
  }
  function playQs() {
    var cats = catList().slice(0, 6);
    return all().map(function (q) {
      var ci = cats.findIndex(function (c) { return norm(c) === norm(q.cat); });
      return ci < 0 ? null : { id: q.id, cat: ci, hard: !!q.hard, people: people(q.people), q: q.q, opts: q.opts || [], a: q.a || '', img: q.img || '', img2: q.img2 || '' };
    }).filter(Boolean);
  }
  var CATS = [], QS = [], SPQ = { duelo: [], reto: [] };
  function refresh() {
    CATS = catList().slice(0, 6); QS = playQs();
    SPQ = { duelo: [], reto: [] };
    all().forEach(function (q) {
      var k = special(q.cat);
      if (k) SPQ[k].push({ id: q.id, kind: k, cat: -1, hard: false, people: people(q.people), q: q.q, opts: q.opts || [], a: q.a || '', img: q.img || '', img2: q.img2 || '' });
    });
  }
  function catName(i) { return CATS[i] || ('Categoría ' + (i + 1)); }
  function ncat() { return CATS.length; }
  function kcls(name) { var k = special(name); return k === 'duelo' ? 'kd' : k === 'reto' ? 'kx' : 'k' + catIdx(name); }
  function catIdx(name) { var i = CATS.findIndex(function (c) { return norm(c) === norm(name); }); return i < 0 ? 0 : i; }

  /* ---------- Excel: leer y escribir ---------- */
  /* preguntas.xlsx es la base. Cada envío de una amiga es un Excel pequeño en la carpeta envios/
     (nuevas, editadas y borradas). La web los aplica en orden encima de la base. */
  var REPO = 'CiaSeg/trivial', BRANCH = 'master', ENVDIR = 'envios/';
  function col(H, test) { for (var i = 0; i < H.length; i++) if (test(norm(H[i]))) return i; return -1; }
  function rowsToQs(wb) {
    var name = wb.SheetNames.find(function (n) { return norm(n).indexOf('pregunta') > -1; }) || wb.SheetNames[0];
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    var hi = rows.findIndex(function (r) { return r.some(function (c) { return norm(c).indexOf('pregunta') === 0; }); });
    if (hi < 0) throw new Error('No encuentro la fila de cabeceras: tiene que haber una columna «Pregunta».');
    var H = rows[hi];
    var C = {
      cat: col(H, function (h) { return h.indexOf('categ') === 0; }),
      dif: col(H, function (h) { return h.indexOf('dific') === 0; }),
      per: col(H, function (h) { return h.indexOf('persona') > -1; }),
      q: col(H, function (h) { return h.indexOf('pregunta') === 0; }),
      opt: col(H, function (h) { return h.indexOf('opcion') > -1; }),
      a: col(H, function (h) { return h.indexOf('respuesta') === 0; }),
      img: col(H, function (h) { return h.indexOf('imagen') > -1 && h.indexOf('respuesta') < 0; }),
      img2: col(H, function (h) { return h.indexOf('imagen') > -1 && h.indexOf('respuesta') > -1; }),
      au: col(H, function (h) { return h.indexOf('autor') === 0; }),
      id: col(H, function (h) { return h === 'id'; }),
      act: col(H, function (h) { return h.indexOf('accion') === 0; })
    };
    if (C.cat < 0) throw new Error('Falta la columna «Categoría» en el Excel.');
    var qs = [], ids = {};
    rows.slice(hi + 1).forEach(function (r) {
      function v(k) { return C[k] > -1 ? String(r[C[k]] || '').trim() : ''; }
      var c = v('cat'), q = v('q'), id = v('id'), del = /borr|elimin/.test(norm(v('act')));
      if (!del && (!c || !q)) return;
      if (!id) { if (del) return; id = 'x-' + norm(c) + '|' + norm(q); }
      while (ids[id]) id += '+';
      ids[id] = 1;
      qs.push({
        id: id, cat: c, hard: /dific|quesito|alta|dura|hard/.test(norm(v('dif'))),
        people: v('per'), q: q, opts: splitList(v('opt'), /;|\n|\|/), a: v('a'),
        img: safeImg(v('img')), img2: safeImg(v('img2')), author: v('au'), del: del
      });
    });
    return qs;
  }
  function qsToWorkbook(qs, envio) {
    var head = envio ? HEAD.concat(['Acción']) : HEAD;
    var aoa = [head].concat(qs.map(function (q) {
      var r = [q.cat, q.hard ? 'Difícil' : 'Normal', q.people || '', q.q, (q.opts || []).join('; '), q.a || '', q.img || '', q.img2 || '', q.author || '', q.id];
      if (envio) r.push(q.del ? 'Borrar' : (S.repo.some(function (x) { return x.id === q.id; }) ? 'Editar' : 'Nueva'));
      return r;
    }));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [20, 11, 24, 60, 40, 30, 22, 22, 14, 16, 10].map(function (w) { return { wch: w }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Preguntas');
    return wb;
  }
  function fetchXlsx(url) {
    return fetch(url + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('No encuentro ' + url + ' junto a la página.'); return r.arrayBuffer(); })
      .then(function (buf) { return rowsToQs(XLSX.read(buf, { type: 'array' })); });
  }
  function listEnvios() {
    return fetch('https://api.github.com/repos/' + REPO + '/contents/' + ENVDIR.slice(0, -1) + '?ref=' + BRANCH + '&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (r.status === 404) return []; if (!r.ok) throw new Error('api'); return r.json(); })
      .then(function (list) { return (Array.isArray(list) ? list : []).map(function (x) { return x.name; }).filter(function (n) { return /\.xlsx$/i.test(n); }).sort(); });
  }
  function applyEnvio(base, rows) {
    var idx = {};
    base.forEach(function (q, i) { if (q) idx[q.id] = i; });
    rows.forEach(function (q) {
      var i = idx[q.id];
      if (q.del) { if (i !== undefined) base[i] = null; delete idx[q.id]; return; }
      if (i !== undefined) base[i] = q; else { idx[q.id] = base.length; base.push(q); }
    });
    return base;
  }
  /* Lo que ya está publicado igual que en local deja de contar como cambio local */
  function prune() {
    var byId = {};
    S.repo.forEach(function (q) { byId[q.id] = q; });
    /* Si lo publicado es igual, o es más reciente que lo que envié, manda lo publicado */
    function stale(q) {
      var r = byId[q.id];
      if (!r) return false;
      if (sig(r) === sig(q)) return true;
      var at = S.local.sentAt[q.id];
      return S.local.sent[q.id] === sig(q) && !!r.t && !!at && r.t >= at;
    }
    S.local.added = S.local.added.filter(function (q) { return !stale(q); });
    Object.keys(S.local.edits).forEach(function (id) { if (stale(S.local.edits[id])) delete S.local.edits[id]; });
    Object.keys(S.local.deleted).forEach(function (id) { if (!byId[id] && S.local.sent[id] === 'DEL') delete S.local.deleted[id]; });
    saveLocal();
  }
  function loadExcel() {
    S.loading = true; S.error = ''; S.envNote = ''; render();
    if (typeof XLSX === 'undefined') { S.loading = false; S.error = 'No se ha podido cargar el lector de Excel. Revisa la conexión a internet.'; refresh(); render(); return; }
    fetchXlsx(EXCEL)
      .then(function (base) {
        return listEnvios().catch(function () { S.envNote = 'GitHub no ha respondido y faltan los últimos envíos. Recarga en un rato.'; return []; })
          .then(function (names) {
            S.envCount = names.length;
            return names.reduce(function (p, n) {
              var t = (n.match(/^(\d{8}-\d{6})/) || [])[1] || '';
              return p.then(function (acc) { return fetchXlsx(ENVDIR + encodeURIComponent(n)).then(function (rows) { rows.forEach(function (q) { q.t = t; }); return applyEnvio(acc, rows); }).catch(function () { return acc; }); });
            }, Promise.resolve(base));
          });
      })
      .then(function (qs) { S.repo = qs.filter(Boolean); S.source = EXCEL; S.loading = false; prune(); refresh(); render(); })
      .catch(function (e) {
        S.loading = false;
        S.error = location.protocol === 'file:'
          ? 'Has abierto la página con doble clic y el navegador no deja leer el Excel así. Ábrela desde IntelliJ o desde la web publicada.'
          : (e.message || 'No se ha podido leer el Excel.');
        refresh(); render();
      });
  }

  /* ---------- Paquete .zip con los cambios ---------- */
  function stamp() {
    var d = new Date(); function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function buildZip(rows, fname, xlsxPath) {
    var zip = new JSZip(), names = {};
    zip.file(xlsxPath, XLSX.write(qsToWorkbook(rows, true), { type: 'array', bookType: 'xlsx' }));
    rows.forEach(function (q) { if (!q.del) [q.img, q.img2].forEach(function (n) { if (n && IMG[n]) names[n] = 1; }); });
    var jobs = Object.keys(names).map(function (n) {
      return getImgBlob(n).then(function (b) { if (b) zip.file(IMGDIR + n, b); });
    });
    return Promise.all(jobs).then(function () { return zip.generateAsync({ type: 'blob', mimeType: 'application/zip' }); })
      .then(function (blob) { return { blob: blob, name: fname, count: rows.length, imgs: Object.keys(names).length }; });
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function canShare(blob, name) {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: 'application/zip' })] })); } catch (e) { return false; }
  }

  /* ---------- Dibujo ---------- */
  function slice(i, r) {
    var a0 = (i * 60 - 30) * Math.PI / 180, a1 = (i * 60 + 30) * Math.PI / 180;
    function p(a) { return (100 + r * Math.sin(a)).toFixed(2) + ' ' + (100 - r * Math.cos(a)).toFixed(2); }
    return 'M100 100L' + p(a0) + 'A' + r + ' ' + r + ' 0 0 1 ' + p(a1) + 'Z';
  }
  function token(won, t, label) {
    var s = '<svg class="token" viewBox="0 0 200 200" role="img" aria-label="' + esc(label || 'Quesitos') + '">';
    for (var i = 0; i < 6; i++) {
      var own = won[i];
      s += '<path class="k' + i + ' ' + (own ? 'w' : 'nw') + '" d="' + slice(i, 96) + '"' +
        (t != null ? ' data-action="wedge" data-t="' + t + '" data-i="' + i + '"' : '') + '><title>' +
        esc(catName(i)) + (own ? ' (conseguido)' : '') + '</title></path>';
    }
    return s + '</svg>';
  }
  function lights() {
    var s = '<ul class="lights" aria-hidden="true">';
    for (var i = 0; i < 26; i++) s += '<li class="k' + (i % 6) + '" style="--d:-' + ((i * 0.43) % 2.6).toFixed(2) + 's"></li>';
    return s + '</ul>';
  }
  function pie(i) {
    var s = '<svg class="pk-ico" viewBox="0 0 200 200" aria-hidden="true">';
    for (var k = 0; k < 6; k++) s += '<path d="' + slice(k, 96) + '" fill="currentColor" opacity="' + (k === i ? 1 : 0.28) + '" stroke="var(--k)" stroke-width="6" stroke-linejoin="round"/>';
    return s + '</svg>';
  }
  function confetti() {
    var s = '<div class="confetti" aria-hidden="true">';
    for (var i = 0; i < 30; i++) {
      s += '<i style="left:' + Math.round(Math.random() * 100) + '%;background:var(--k' + (i % 6) + ');animation-duration:' + (2.8 + Math.random() * 2.6).toFixed(1) + 's;animation-delay:-' + (Math.random() * 5).toFixed(1) + 's"></i>';
    }
    return s + '</div>';
  }
  function logo() {
    var s = '<svg class="logo" viewBox="0 0 200 200" aria-hidden="true">';
    for (var i = 0; i < 6; i++) s += '<path class="k' + i + '" d="' + slice(i, 96) + '" fill="var(--k)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round"/>';
    return s + '</svg>';
  }

  /* ---------- Sorteo ---------- */
  function allowed(q, team) {
    var ppl = people(team.members);
    return !q.people.some(function (p) { return ppl.indexOf(p) > -1; });
  }
  function pool(ci, hard, team) {
    return QS.filter(function (q) { return q.cat === ci && q.hard === hard && allowed(q, team); });
  }
  function draw(ci, hard, avoid) {
    var g = S.game, team = g.teams[g.turn], note = '', p = pool(ci, hard, team);
    if (!p.length && hard) { p = pool(ci, false, team); hard = false; note = 'No quedan preguntas difíciles en esta categoría para este equipo, así que sale una normal.'; }
    if (!p.length && !hard) { var h = pool(ci, true, team); if (h.length) p = h; }
    if (!p.length) return { error: 'No hay ninguna pregunta de «' + catName(ci) + '» que pueda contestar ' + team.name + '.' };
    var fresh = p.filter(function (q) { return !g.used[q.id] && q.id !== avoid; });
    if (!fresh.length) {
      p.forEach(function (q) { delete g.used[q.id]; });
      fresh = p.filter(function (q) { return q.id !== avoid; });
      if (!fresh.length) fresh = p;
      note = (note ? note + ' ' : '') + 'Ya habían salido todas las de este montón: vuelven a empezar.';
    }
    var q = fresh[Math.floor(Math.random() * fresh.length)];
    g.used[q.id] = 1;
    return { q: clone(q), note: note };
  }
  function drawSpecial(kind, teams, avoid) {
    var g = S.game, note = '';
    var p = SPQ[kind].filter(function (q) { return teams.every(function (t) { return allowed(q, t); }); });
    if (!p.length) return { error: kind === 'duelo' ? 'No hay preguntas de duelo que puedan jugar estos equipos. Añádelas en «Crear preguntas» (categoría ⚔️ Duelo).' : 'No hay retos para todos. Añádelos en «Crear preguntas» (categoría 🎯 Reto para todos).' };
    var fresh = p.filter(function (q) { return !g.used[q.id] && q.id !== avoid; });
    if (!fresh.length) {
      p.forEach(function (q) { delete g.used[q.id]; });
      fresh = p.filter(function (q) { return q.id !== avoid; });
      if (!fresh.length) fresh = p;
      note = 'Ya habían salido todos: vuelven a empezar.';
    }
    var q = fresh[Math.floor(Math.random() * fresh.length)];
    g.used[q.id] = 1;
    return { q: clone(q), note: note };
  }
  function stealable(att, def) { var out = []; for (var i = 0; i < ncat(); i++) if (def.won[i] && !att.won[i]) out.push(i); return out; }
  function missing(t) { var out = []; for (var i = 0; i < ncat(); i++) if (!t.won[i]) out.push(i); return out; }
  function nextTurn() { var g = S.game; g.turn = (g.turn + 1) % g.teams.length; g.phase = 'ready'; g.cur = null; g.cat = null; g.duel = null; g.retoWin = null; }
  function wedgeBtn(i, action, extra) {
    return '<button class="wbtn k' + i + '" data-action="' + action + '" data-i="' + i + '"' + (extra || '') + '>' + pie(i).replace('pk-ico', 'pk-ico') + esc(catName(i)) + '</button>';
  }
  function countLeft(ci, team, hard) {
    var p = pool(ci, hard, team);
    return { all: p.length, left: p.filter(function (q) { return !S.game.used[q.id]; }).length };
  }
  function isFinalFor(team) {
    var n = ncat();
    if (!n) return false;
    for (var i = 0; i < n; i++) if (!team.won[i]) return false;
    return true;
  }

  /* ---------- Vistas: cabecera ---------- */
  function header() {
    return lights() + '<header class="top"><div class="brand">' + logo() +
      '<div><h1>Trivial del <span class="hl">Lore</span></h1><p class="sub">Cena de Navidad</p></div></div>' +
      '<nav class="tabs" aria-label="Secciones">' +
      '<button class="tab" data-action="view" data-view="play" aria-pressed="' + (S.view === 'play') + '">Jugar</button>' +
      '<button class="tab" data-action="view" data-view="make" aria-pressed="' + (S.view === 'make') + '">Crear preguntas</button>' +
      '</nav></header>';
  }
  function loadNote() {
    if (S.loading) return '<p class="note">Cargando preguntas…</p>';
    if (S.error) return '<p class="note err">' + esc(S.error) + '</p>';
    return '';
  }

  /* ---------- Vistas: partida ---------- */
  function setupView() {
    var rows = S.teams.map(function (t, i) {

    return '<section class="setup"><div class="card"><h2>¿Quién juega?</h2>' +
      '<p class="lead">Poned nombre a los equipos y quién está en cada uno, separado por comas. Así a nadie le sale una pregunta sobre sí misma.</p>' +

      '<button class="btn ghost small" data-action="delteam"' + (S.teams.length <= 2 ? ' disabled' : '') + '>− Quitar equipo</button></div>' +
      '<button class="btn big" data-action="start"' + (n ? '' : ' disabled') + '>Empezar partida</button>' +
      (n ? '<div class="banner">' + n + ' preguntas listas en ' + ncat() + ' categorías.</div>' :
        (S.loading ? '' : '<div class="banner">Todavía no hay preguntas. Créalas en la pestaña «Crear preguntas».</div>')) +
      '<details class="rules"><summary>Cómo se juega</summary><ol>' +
      '<li>Jugad en el tablero físico. Cuando la ficha de un equipo caiga en una casilla, tocad aquí la categoría de ese color.</li>' +

      '<li>🎯 Reto para todos: juegan todos los equipos y quien gane elige el quesito que quiere.</li>' +

      '</ol></details></div>' + art + '</section>';
  }

  function gameView() {
    var g = S.game, team = g.teams[g.turn];
    var board = '<h2 class="eyebrow">Marcador</h2>' + g.teams.map(function (t, i) {
      var n = t.won.filter(Boolean).length, on = i === g.turn && g.phase !== 'over';

    board += '<p class="hint">Si te equivocas con el marcador, toca un quesito para ponerlo o quitarlo cuando toque elegir categoría.</p>' +

    var stage = loadNote();

    if (g.phase === 'ready') {
      var fin = isFinalFor(team), hard = fin || g.wedgeNext;
      stage += '<div class="centered"><p class="turnline">Juega<strong>' + esc(team.name) + '</strong></p>' +
        (fin ? '<p class="turnhint">Tenéis todos los quesitos. Elegid la categoría de la pregunta final.</p>'
             : '<p class="turnhint">Toca la categoría de la casilla donde ha caído vuestra ficha.</p>') +
        '<div class="picker">' + CATS.map(function (c, i) {
          var cl = countLeft(i, team, hard), sub;
          if (team.won[i] && !fin && !g.wedgeNext) sub = 'Quesito conseguido ✓';
          else if (cl.all) sub = cl.left + ' de ' + cl.all + (hard ? ' difíciles' : '') + ' sin salir';
          else if (hard) sub = 'Sin difíciles · saldrá normal';

          return '<button class="pick k' + i + '" data-action="pick" data-i="' + i + '">' + pie(i) +
            '<span class="pk-txt"><span class="pk-name">' + esc(c) + '</span><span class="pk-sub">' + esc(sub) + '</span></span></button>';
        }).join('') + '</div>' +
        (fin ? '' : '<label class="wedgechk" for="wedgesq"><input type="checkbox" id="wedgesq"' + (g.wedgeNext ? ' checked' : '') + '>Es casilla de quesito <small>· pregunta difícil</small></label>' +
          '<p class="eyebrow" style="margin-top:26px">¿Casilla especial?</p><div class="specials">' +
          '<button class="pick kd" data-action="duel"><span class="emo">⚔️</span><span class="pk-txt"><span class="pk-name">Duelo</span><span class="pk-sub">Reta a otro equipo y róbale un quesito · ' + SPQ.duelo.length + ' preguntas</span></span></button>' +
          '<button class="pick kx" data-action="reto"><span class="emo">🎯</span><span class="pk-txt"><span class="pk-name">Reto para todos</span><span class="pk-sub">Juegan todos; quien gane elige quesito · ' + SPQ.reto.length + ' retos</span></span></button></div>') +
        '<p class="eyebrow" style="margin-top:26px">¿Cambia el turno? Elige equipo</p>' +
        '<div class="turns">' + g.teams.map(function (t, i) {
          return '<button class="turnbtn" data-action="setturn" data-t="' + i + '" aria-pressed="' + (i === g.turn) + '"><span class="pn">' + (i + 1) + '</span>' + esc(t.name) + '</button>';
        }).join('') + '</div></div>';
    } else if (g.phase === 'duel-pick') {
      var d0 = g.duel || {};
      if (d0.rival == null) {
        stage += '<div class="centered"><p class="turnline">⚔️ Duelo<strong>' + esc(team.name) + ' reta a…</strong></p>' +
          '<p class="turnhint">Elegid el equipo al que queréis robar un quesito.</p><div class="versus">' +
          g.teams.map(function (t, i) {
            if (i === g.turn) return '';
            var can = stealable(team, t).length;
            return '<button class="vteam" data-action="duelrival" data-t="' + i + '"' + (can ? '' : ' disabled title="No tiene quesitos que os falten"') + '>' + token(t.won, null, t.name) +
              '<span>' + esc(t.name) + '<br><small class="tcount">' + (can ? can + (can === 1 ? ' quesito para robar' : ' quesitos para robar') : 'Nada que robar') + '</small></span></button>';
          }).join('') + '</div><div class="actions"><button class="btn ghost" data-action="specback">Cancelar</button></div></div>';
      } else {
        var rv = g.teams[d0.rival];
        stage += '<div class="centered"><p class="turnline">⚔️ Duelo contra ' + esc(rv.name) + '<strong>¿Qué quesito queréis robar?</strong></p><div class="wpick">' +
          stealable(team, rv).map(function (i) { return wedgeBtn(i, 'duelwedge'); }).join('') + '</div>' +
          '<div class="actions"><button class="btn ghost" data-action="duelrival" data-t="">Elegir otro equipo</button></div></div>';
      }
    } else if (g.phase === 'reto-pick') {
      var wt = g.teams[g.retoWin], miss = missing(wt);
      stage += confetti() + '<div class="centered win"><p class="turnline">🎯 ¡Gana el reto!<strong>' + esc(wt.name) + '</strong></p>' +
        (miss.length ? '<p class="turnhint">Elegid el quesito que queréis.</p><div class="wpick">' + miss.map(function (i) { return wedgeBtn(i, 'retowedge'); }).join('') + '</div>'
          : '<p class="turnhint">Ya tenéis todos los quesitos. ¡A por la final!</p><div class="actions"><button class="btn big" data-action="retowedge" data-i="-1">Seguir</button></div>') + '</div>';
    } else if (g.phase === 'sp-q' || g.phase === 'sp-a') {
      var sq = g.cur, sshown = g.phase === 'sp-a', isDuel = sq.kind === 'duelo', dd = g.duel || {};
      var sright = function (o) { return sq.a && norm(o) === norm(sq.a); };
      stage += '<article class="qcard ' + (isDuel ? 'kd' : 'kx') + '"><div class="qhead"><span class="cname">' + (isDuel ? '⚔️ Duelo' : '🎯 Reto para todos') + '</span>' +
        (isDuel ? '<span class="badge solid">' + esc(team.name) + ' contra ' + esc(g.teams[dd.rival].name) + '</span><span class="badge">Se juegan: ' + esc(catName(dd.wedge)) + '</span>' : '<span class="badge solid">Juegan todos los equipos</span>') +
        '</div><div class="qbody"><p class="qtext">' + esc(sq.q) + '</p>' + imgTag(sq.img);
      if (sq.opts.length) {
        stage += '<ol class="opts' + (sshown && sq.opts.some(sright) ? ' done' : '') + '">' + sq.opts.map(function (o, i) {
          return '<li' + (sshown && sright(o) ? ' class="right"' : '') + '><b>' + (sshown && sright(o) ? '✓' : String.fromCharCode(65 + i)) + '</b>' + esc(o) + '</li>';
        }).join('') + '</ol>';
      }
      if (sshown) stage += '<div class="answer"><small>' + (isDuel ? 'Respuesta' : 'Respuesta / cómo se gana') + '</small><p>' + esc(sq.a || 'Decide la mesa.') + '</p>' + imgTag(sq.img2) + '</div>';
      if (!sshown) {
        stage += '<div class="actions"><button class="btn big" data-action="spshow">' + (sq.a ? 'Ver respuesta' : 'Ya está, ¿quién gana?') + '</button>' +
          '<button class="btn ghost" data-action="spswap">Cambiar</button><button class="btn ghost" data-action="specback">Cancelar</button></div>';
      } else if (isDuel) {
        stage += '<p class="hint" style="margin-top:18px">¿Quién gana el duelo?</p><div class="winners">' +
          '<button class="btn big ok" data-action="duelwin" data-v="att">Gana ' + esc(team.name) + ' · roba el quesito</button>' +
          '<button class="btn big ko" data-action="duelwin" data-v="def">Gana ' + esc(g.teams[dd.rival].name) + ' · lo defiende</button>' +
          '<button class="btn ghost" data-action="spswap" style="border-color:currentColor;color:inherit">Empate: otra pregunta</button></div>';
      } else {
        stage += '<p class="hint" style="margin-top:18px">¿Quién gana el reto?</p><div class="winners">' +
          g.teams.map(function (t, i) { return '<button class="btn big ok" data-action="retowin" data-t="' + i + '">Gana ' + esc(t.name) + '</button>'; }).join('') +
          '<button class="btn ghost" data-action="retowin" data-t="-1" style="border-color:currentColor;color:inherit">Nadie</button></div>';
      }
      stage += '</div></article>';
    } else if (g.phase === 'question' || g.phase === 'answer') {
      var q = g.cur, shown = g.phase === 'answer';
      var right = function (o) { return q.a && norm(o) === norm(q.a); };
      stage += '<article class="qcard k' + g.cat + '"><div class="qhead"><span class="cname">' + esc(catName(g.cat)) + '</span>' +
        (g.final ? '<span class="badge solid">Pregunta final</span>' : '') +
        (g.wedgeSq && !team.won[g.cat] ? '<span class="badge solid">Casilla de quesito</span>' : '') +
        '<span class="badge">' + (q.hard ? 'Difícil' : 'Normal') + '</span>' +
        '</div><div class="qbody"><p class="qtext">' + esc(q.q) + '</p>' + imgTag(q.img);
      if (q.opts.length) {
        stage += '<ol class="opts' + (shown && q.opts.some(right) ? ' done' : '') + '">' + q.opts.map(function (o, i) {
          return '<li' + (shown && right(o) ? ' class="right"' : '') + '><b>' + (shown && right(o) ? '✓' : String.fromCharCode(65 + i)) + '</b>' + esc(o) + '</li>';
        }).join('') + '</ol>';
      }
      if (shown) stage += '<div class="answer"><small>Respuesta</small><p>' + esc(q.a || 'Esta pregunta no tiene respuesta. Decide la mesa.') + '</p>' + imgTag(q.img2) + '</div>';
      if (!shown) {
        stage += '<div class="actions"><button class="btn big" data-action="show">Ver respuesta</button>' +

      } else {
        stage += '<p class="hint" style="margin-top:18px">Juega ' + esc(team.name) + '. ¿Cuenta?</p>' +
          '<div class="actions two"><button class="btn big ok" data-action="ok">Acierto</button><button class="btn big ko" data-action="ko">Fallo</button></div>';
      }
      stage += '</div></article>';
    } else {
      var w = g.teams[g.winner];
      stage += confetti() + '<div class="win">' + token([true, true, true, true, true, true], null, 'Seis quesitos') +
        '<h2>¡Ganan ' + esc(w.name) + '!</h2><p>Todos los quesitos y la pregunta final acertada.</p>' +
        '<button class="btn big" data-action="again">Otra partida</button></div>';
    }
    return '<div class="game"><aside class="board" aria-label="Marcador">' + board + '</aside><section class="stage">' + stage + '</section></div>';
  }

  /* ---------- Vistas: crear preguntas ---------- */
  function editorCats() {
    var cats = catList();
    return cats.slice(0, 6);
  }
  function knownPeople() {
    var out = [], seen = {};
    function add(n) { n = String(n || '').trim(); if (n && !seen[norm(n)]) { seen[norm(n)] = 1; out.push(n); } }
    all().forEach(function (q) { splitList(q.people, /,|;|\//).forEach(add); });
    S.teams.forEach(function (t) { splitList(t.members, /,|;/).forEach(add); });
    if (S.form) splitList(S.form.people, /,/).forEach(add);
    return out.sort(function (a, b) { return a.localeCompare(b, 'es'); });
  }
  function isOrg() { return norm(S.local.author) === 'lucia'; }
  function isMine(q) { return !!S.local.author && norm(q.author) === norm(S.local.author); }
  function canEdit(q) { return isOrg() || isMine(q); }
  function mine() { return all().filter(isMine); }
  function sig(q) { return JSON.stringify([q.cat, !!q.hard, q.people || '', q.q, q.opts || [], q.a || '', q.img || '', q.img2 || '']); }
  function inRepo(id) { return S.repo.find(function (r) { return r.id === id; }); }
  /* Cambios hechos en este dispositivo que aún no se han enviado */
  function changes() {
    var out = [];
    S.local.added.forEach(function (q) { if (S.local.sent[q.id] !== sig(q)) out.push(q); });
    Object.keys(S.local.edits).forEach(function (id) {
      var q = S.local.edits[id];
      if (!S.local.deleted[id] && S.local.sent[id] !== sig(q)) out.push(q);
    });
    Object.keys(S.local.deleted).forEach(function (id) {
      if (S.local.sent[id] === 'DEL') return;
      var q = S.local.deleted[id];
      out.push(Object.assign({}, typeof q === 'object' ? q : (inRepo(id) || { id: id, cat: '', q: '' }), { id: id, del: true }));
    });
    return out;
  }
  function status(q) {
    var r = inRepo(q.id);
    if (r && sig(r) === sig(q)) return '<span class="tag-ok">✓ Publicada</span>';
    if (S.local.sent[q.id] === sig(q)) return '<span class="tag-ok">✓ Enviada</span>';
    return '<strong>Sin enviar</strong>';
  }
  function safeName() { return norm(S.local.author).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'amiga'; }
  function prepPack() {
    var ch = changes();
    if (!ch.length) { S.pack = null; return; }
    var key = ch.map(function (q) { return q.del ? 'D' + q.id : sig(q); }).join('|');
    if ((S.pack && S.pack.key === key) || S.packing === key) return;
    S.packing = key;
    var st = stamp();
    buildZip(ch, 'trivial-' + safeName() + '-' + st + '.zip', ENVDIR + st + '-' + safeName() + '.xlsx').then(function (pk) {
      if (S.packing !== key) return;
      pk.key = key; pk.rows = ch; pk.stamp = st; S.pack = pk; S.packing = '';

  /* ---------- Formulario ---------- */
  function newForm(q) {

    var right = test ? q.opts.findIndex(function (o) { return norm(o) === norm(q.a); }) : -1;
    return { editing: q.id, cat: q.cat, hard: !!q.hard, q: q.q, mode: test ? 'test' : 'free', a: test ? '' : q.a,
      opts: test ? q.opts.slice() : ['', '', ''], right: right, people: q.people || '', img: q.img || '', img2: q.img2 || '', author: q.author };

  function findQ(id) { return all().find(function (q) { return q.id === id; }); }
  function saveForm() {
    var f = S.form;
    if (!f.cat) { S.formErr = 'Elige una categoría.'; return false; }
    if (!f.q.trim()) { S.formErr = 'Escribe la pregunta.'; return false; }
    var opts = [], a = f.a.trim();
    if (f.mode === 'test') {
      var clean = [], right = '';
      f.opts.forEach(function (o, i) { o = o.trim(); if (o) { clean.push(o); if (i === f.right) right = o; } });

      if (!right) { S.formErr = 'Marca cuál es la opción correcta.'; return false; }
      opts = clean; a = right;
    } else if (!a && special(f.cat) !== 'reto') { S.formErr = 'Escribe la respuesta.'; return false; }
    var q = { id: f.editing || ('q-' + rid()), cat: special(f.cat) ? SPNAME[special(f.cat)] : f.cat, hard: special(f.cat) ? false : f.hard, people: f.people, q: f.q.trim(), opts: opts, a: a,
      img: f.img, img2: f.img2, author: f.author || S.local.author };

    if (ai > -1) S.local.added[ai] = q;

  function imgUsed(name) {

  /* ---------- Partida ---------- */
  function saveGame() { if (S.game) lsSet(GKEY, JSON.stringify(S.game)); else lsDel(GKEY); }
  function saveTeams() { lsSet(NKEY, JSON.stringify(S.teams)); }
  function startGame() {
    S.game = {
      teams: S.teams.map(function (t, i) { return { name: t.name.trim() || ('Equipo ' + (i + 1)), members: t.members.trim(), won: [false, false, false, false, false, false] }; }),
      turn: 0, phase: 'ready', cat: null, cur: null, final: false, wedgeSq: false, wedgeNext: false, used: {}, winner: null
    };
    S.msg = ''; saveGame(); render();
  }
  function choose(ci) {
    var g = S.game;
    if (!g || g.phase !== 'ready') return;
    var fin = isFinalFor(g.teams[g.turn]);
    var r = draw(ci, fin || g.wedgeNext);
    if (r.error) { S.msg = r.error; render(); return; }
    g.cat = ci; g.final = fin; g.wedgeSq = !fin && !!g.wedgeNext; g.wedgeNext = false;
    g.cur = r.q; g.phase = 'question'; S.msg = r.note; saveGame(); render();
  }
  function swap() {
    var g = S.game, r = draw(g.cat, g.final || g.wedgeSq, g.cur.id);
    if (r.error) S.msg = r.error; else { g.cur = r.q; S.msg = r.note; }
    saveGame(); render();
  }
  function judge(ok) {
    var g = S.game, team = g.teams[g.turn];
    if (ok) {
      if (g.final) { g.phase = 'over'; g.winner = g.turn; S.msg = ''; }
      else {
        if (g.wedgeSq && !team.won[g.cat]) {
          team.won[g.cat] = true;
          S.msg = '¡Quesito de ' + catName(g.cat) + ' para ' + team.name + '! Tira otra vez.';
        } else S.msg = 'Acierto de ' + team.name + '. Tira otra vez.';
        g.phase = 'ready'; g.cat = null; g.cur = null; g.wedgeSq = false;
      }
    } else {
      S.msg = 'Fallo de ' + team.name + '. Pasa el turno.';
      g.turn = (g.turn + 1) % g.teams.length; g.phase = 'ready'; g.cat = null; g.cur = null; g.final = false; g.wedgeSq = false;
    }
    saveGame(); render();
  }

  /* ---------- Eventos ---------- */
  function top() { window.scrollTo(0, 0); }
  function act(a, el) {
    var d = el.dataset, g = S.game, f = S.form;
    switch (a) {
      case 'view': S.view = d.view; S.msg = ''; render(); top(); break;
      case 'addteam': if (S.teams.length < 6) { S.teams.push({ name: 'Equipo ' + (S.teams.length + 1), members: '' }); saveTeams(); render(); } break;
      case 'delteam': if (S.teams.length > 2) { S.teams.pop(); saveTeams(); render(); } break;
      case 'start': startGame(); top(); break;
      case 'setturn': if (g && g.phase === 'ready') { g.turn = +d.t; S.msg = ''; saveGame(); render(); } break;
      case 'pick': choose(+d.i); top(); break;
      case 'show': g.phase = 'answer'; saveGame(); render(); break;
      case 'duel':
        if (!g || g.phase !== 'ready') break;
        if (!g.teams.some(function (t, i) { return i !== g.turn && stealable(g.teams[g.turn], t).length; })) { S.msg = 'Ningún equipo tiene quesitos que os falten: no hay nada que robar todavía.'; render(); break; }
        if (!SPQ.duelo.length) { S.msg = 'Todavía no hay preguntas de duelo. Añádelas en «Crear preguntas» (categoría ⚔️ Duelo).'; render(); break; }
        g.wedgeNext = false; g.duel = { rival: null, wedge: null }; g.phase = 'duel-pick'; S.msg = ''; saveGame(); render(); top(); break;
      case 'duelrival': g.duel.rival = d.t === '' ? null : +d.t; saveGame(); render(); break;
      case 'duelwedge': {
        g.duel.wedge = +d.i;
        var dr = drawSpecial('duelo', [g.teams[g.turn], g.teams[g.duel.rival]]);
        if (dr.error) { S.msg = dr.error; g.phase = 'ready'; g.duel = null; saveGame(); render(); break; }
        g.cur = dr.q; g.phase = 'sp-q'; S.msg = dr.note; saveGame(); render(); top(); break;
      }
      case 'reto': {
        if (!g || g.phase !== 'ready') break;
        var rr = drawSpecial('reto', []);
        if (rr.error) { S.msg = rr.error; render(); break; }
        g.wedgeNext = false; g.cur = rr.q; g.phase = 'sp-q'; S.msg = rr.note; saveGame(); render(); top(); break;
      }
      case 'spshow': g.phase = 'sp-a'; saveGame(); render(); break;
      case 'spswap': {
        var isD = g.cur.kind === 'duelo';
        var sw = drawSpecial(g.cur.kind, isD ? [g.teams[g.turn], g.teams[g.duel.rival]] : [], g.cur.id);
        if (!sw.error) { g.cur = sw.q; S.msg = sw.note || (g.phase === 'sp-a' && isD ? 'Empate: desempate con otra pregunta.' : ''); }
        g.phase = 'sp-q'; saveGame(); render(); break;
      }
      case 'specback': g.phase = 'ready'; g.cur = null; g.duel = null; S.msg = ''; saveGame(); render(); break;
      case 'duelwin': {
        var at = g.teams[g.turn], df = g.teams[g.duel.rival], wi = g.duel.wedge;
        if (d.v === 'att') { df.won[wi] = false; at.won[wi] = true; S.msg = '⚔️ ¡' + at.name + ' roba el quesito de ' + catName(wi) + ' a ' + df.name + '!'; }
        else S.msg = '🛡️ ' + df.name + ' defiende su quesito de ' + catName(wi) + '.';
        S.msg += ' Turno de ' + g.teams[(g.turn + 1) % g.teams.length].name + '.';
        nextTurn(); saveGame(); render(); top(); break;
      }
      case 'retowin':
        if (d.t === '-1') { S.msg = 'Nadie gana el reto. Turno de ' + g.teams[(g.turn + 1) % g.teams.length].name + '.'; nextTurn(); }
        else { g.retoWin = +d.t; g.phase = 'reto-pick'; g.cur = null; }
        saveGame(); render(); top(); break;
      case 'retowedge': {
        var rw = g.teams[g.retoWin];
        if (+d.i >= 0) { rw.won[+d.i] = true; S.msg = '🎯 ' + rw.name + ' se lleva el quesito de ' + catName(+d.i) + '.'; } else S.msg = '';
        S.msg += ' Turno de ' + g.teams[(g.turn + 1) % g.teams.length].name + '.';
        nextTurn(); saveGame(); render(); top(); break;
      }
      case 'swap': swap(); break;
      case 'back': g.wedgeNext = g.wedgeSq; g.phase = 'ready'; g.cat = null; g.cur = null; g.final = false; g.wedgeSq = false; S.msg = ''; saveGame(); render(); break;
      case 'ok': judge(true); top(); break;
      case 'ko': judge(false); top(); break;
      case 'again': S.game = null; S.msg = ''; saveGame(); render(); break;
      case 'newgame':
        if (S.confirm) { S.confirm = false; clearTimeout(confirmTimer); S.game = null; S.msg = ''; saveGame(); render(); }
        else {
          S.confirm = true; render(); clearTimeout(confirmTimer);
          confirmTimer = setTimeout(function () { S.confirm = false; if (S.view === 'play' && S.game) render(); }, 4000);
        }
        break;
      case 'wedge': if (g && g.phase === 'ready') { var t = g.teams[+d.t]; t.won[+d.i] = !t.won[+d.i]; saveGame(); render(); } break;

      case 'setme': {
        var me = document.getElementById('me'), v = me && me.value.trim();
        if (!v) { me && me.focus(); return; }
        S.local.author = v.slice(0, 30); saveLocal(); render(); break;
      }
      case 'rename': S.local.author = ''; saveLocal(); render(); break;
      case 'new': S.form = newForm(); S.formErr = ''; S.newPerson = ''; S.newCat = ''; render(); top(); break;
      case 'edit': { var q = findQ(d.id); if (q && canEdit(q)) { S.form = newForm(q); S.formErr = ''; render(); top(); } break; }
      case 'del': {
        var dq = findQ(d.id);
        if (!dq || !canEdit(dq)) break;
        if (S.delConfirm !== d.id) {
          S.delConfirm = d.id; render();
          setTimeout(function () { if (S.delConfirm === d.id) { S.delConfirm = ''; render(); } }, 4000);
          break;
        }
        S.delConfirm = '';
        var ai = S.local.added.findIndex(function (x) { return x.id === d.id; });
        if (ai > -1) S.local.added.splice(ai, 1);
        delete S.local.edits[d.id];
        if (inRepo(d.id) || S.local.sent[d.id]) S.local.deleted[d.id] = clone(dq);
        else delete S.local.sent[d.id];
        dropIfUnused(dq.img); dropIfUnused(dq.img2);
        S.pack = null; S.packing = '';
        saveLocal(); refresh(); toast('Pregunta borrada.'); render(); break;
      }
      case 'f-cat': f.cat = d.v; render(); break;
      case 'f-addcat': {
        var nc = (document.getElementById('f-newcat') || {}).value || '';
        nc = nc.trim().slice(0, 40);
        if (special(nc)) { f.cat = SPNAME[special(nc)]; S.newCat = ''; render(); break; }
        if (nc) { f.cat = nc; S.newCat = ''; S.extraCats = (S.extraCats || []).concat(nc); }
        render(); break;
      }
      case 'f-hard': f.hard = d.v === '1'; render(); break;
      case 'f-mode': f.mode = d.v; render(); break;
      case 'f-right': f.right = +d.i; render(); break;
      case 'f-addopt': if (f.opts.length < 6) f.opts.push(''); render(); break;
      case 'f-delopt': {
        var k = +d.i; f.opts.splice(k, 1);
        if (f.right === k) f.right = -1; else if (f.right > k) f.right--;
        render(); break;
      }
      case 'f-person': {
        var list = splitList(f.people, /,/), ix = list.findIndex(function (p) { return norm(p) === norm(d.v); });
        if (ix > -1) list.splice(ix, 1); else list.push(d.v);
        f.people = list.join(', '); render(); break;
      }
      case 'f-addp': {
        var np = ((document.getElementById('f-newp') || {}).value || '').trim();
        if (np) { var l2 = splitList(f.people, /,/); if (!l2.some(function (p) { return norm(p) === norm(np); })) l2.push(np); f.people = l2.join(', '); }
        S.newPerson = ''; render(); break;
      }
      case 'f-rmimg': { var old = f[d.f]; f[d.f] = ''; dropIfUnused(old); render(); break; }
      case 'f-save': if (saveForm()) { S.form = null; S.formErr = ''; toast(isOrg() ? 'Pregunta guardada.' : 'Guardada. Cuando quieras, pulsa «Enviar a Lucía».'); } render(); top(); break;
      case 'f-cancel': { var fi = f; S.form = null; [fi.img, fi.img2].forEach(dropIfUnused); render(); top(); break; }

      case 'send': sendNow(); break;
      case 'filt': S.filt = +d.i; render(); break;
      case 'reload': loadExcel(); break;
      case 'resetused': if (g) { g.used = {}; saveGame(); toast('Todas las preguntas pueden volver a salir.'); } break;
    }
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (b && app.contains(b)) act(b.dataset.action, b);
  });
  app.addEventListener('input', function (e) {
    var el = e.target, f = S.form;
    if (el.dataset.team !== undefined) { S.teams[+el.dataset.team][el.dataset.f] = el.value; saveTeams(); return; }
    if (!f) return;
    if (el.dataset.fld) f[el.dataset.fld] = el.value;
    else if (el.dataset.opt !== undefined) f.opts[+el.dataset.opt] = el.value;
    else if (el.id === 'f-newp') S.newPerson = el.value;
    else if (el.id === 'f-newcat') S.newCat = el.value;
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var id = e.target.id;
    if (id === 'me') { e.preventDefault(); act('setme', e.target); }
    else if (id === 'f-newp') { e.preventDefault(); act('f-addp', e.target); }
    else if (id === 'f-newcat') { e.preventDefault(); act('f-addcat', e.target); }
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'wedgesq' && S.game) { S.game.wedgeNext = el.checked; saveGame(); render(); return; }
    if (el.dataset.up && S.form) {
      var file = el.files && el.files[0], fld = el.dataset.up; if (!file) return;
      toast('Subiendo foto…');
      shrink(file).then(function (blob) {
        var name = 'foto-' + rid() + '.jpg';
        return putImg(name, blob).then(function () { var old = S.form[fld]; S.form[fld] = name; dropIfUnused(old); toast('Foto añadida.'); render(); });
      }).catch(function () { toast('No se ha podido usar esa foto. Prueba con otra (JPG o PNG).'); });
      return;
    }
  });

  /* Categorías creadas en el formulario antes de guardar ninguna pregunta */
  var baseCatList = catList;
  catList = function () {
    var c = baseCatList();
    (S.extraCats || []).forEach(function (x) { if (!c.some(function (y) { return norm(y) === norm(x); })) c.push(x); });
    return c;
  };

  /* ---------- Arranque ---------- */
  try {
    var tn = JSON.parse(lsGet(NKEY));
    if (Array.isArray(tn) && tn.length >= 2) S.teams = tn.slice(0, 6).map(function (t) { return { name: String(t.name || ''), members: String(t.members || '') }; });
  } catch (e) {}
  try {
    var lo = JSON.parse(lsGet(LKEY));
    if (lo && typeof lo === 'object') S.local = { author: String(lo.author || ''), added: Array.isArray(lo.added) ? lo.added : [], edits: lo.edits || {}, deleted: lo.deleted || {}, sent: lo.sent || {}, sentAt: lo.sentAt || {} };
  } catch (e) {}
  try {
    var gg = JSON.parse(lsGet(GKEY));
    if (gg && Array.isArray(gg.teams) && gg.teams.length >= 2) {
      gg.used = gg.used || {}; gg.wedgeSq = !!gg.wedgeSq; gg.wedgeNext = !!gg.wedgeNext;
      gg.teams.forEach(function (t) { t.members = t.members || ''; });
      if ((gg.phase === 'question' || gg.phase === 'answer') && !gg.cur) gg.phase = 'ready';
      S.game = gg;
    }
  } catch (e) {}
  if (/[?&#]crear\b/.test(location.search + location.hash)) S.view = 'make';
  refresh();
  render();
  loadImgs().then(function () { render(); });
  loadExcel();
})();
</script>
</body>
</html>
